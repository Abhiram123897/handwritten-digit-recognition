# render.yaml — Render.com deployment blueprint
# Deploy: push to a Git repo, then "New +" -> "Blueprint" on Render and point it here.
services:
  - type: web
    name: digit-recognizer
    runtime: python
    plan: free                      # 512 MB RAM; TFLite inference keeps us within budget
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
    # NOTE: Persistent disks are not available on Render's free tier, so the
    # SQLite history and uploaded thumbnails live on the container's ephemeral
    # filesystem and reset on restart/redeploy. For durable history, upgrade to
    # a paid plan and add a `disk:` block mounted at .../database, or use an
    # external database.
